<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TechGeo | Deep Data Flow Architecture (L0 → L4) with AI Core</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #03060f;
            font-family: 'Inter', 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            padding: 2rem 1rem;
            color: #eef5ff;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* header section */
        .title-section {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }
        .title-section h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .title-section p {
            color: #7c8db0;
            font-family: monospace;
            margin-top: 0.5rem;
            border-top: 1px solid #1e2a4a;
            display: inline-block;
            padding-top: 0.5rem;
        }

        /* level tabs */
        .level-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }
        .level-btn {
            background: #0f1425;
            border: 1px solid #2d3a5e;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #b9c7e0;
            backdrop-filter: blur(4px);
        }
        .level-btn i {
            margin-right: 6px;
        }
        .level-btn.active {
            background: #2563eb;
            border-color: #60a5fa;
            color: white;
            box-shadow: 0 0 12px rgba(37,99,235,0.4);
        }
        .level-btn:hover:not(.active) {
            background: #1e293b;
            border-color: #5b8ef9;
        }

        /* diagram wrapper */
        .diagram-wrapper {
            background: #050a15;
            border-radius: 2rem;
            border: 1px solid #19233f;
            padding: 1rem;
            overflow-x: auto;
            box-shadow: 0 20px 35px -12px black;
        }
        .svg-container {
            min-width: 1300px;
            width: 100%;
        }
        svg {
            width: 100%;
            height: auto;
            background: #030811;
            border-radius: 1.2rem;
            display: block;
            font-family: 'Inter', 'Segoe UI', monospace;
        }

        /* animation keyframes for data packets */
        @keyframes flowData {
            0% { stroke-dashoffset: 12; opacity: 0.6; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 0px rgba(96,165,250,0)); }
            100% { filter: drop-shadow(0 0 6px rgba(96,165,250,0.7)); }
        }
        .animated-flow {
            animation: flowData 0.5s linear infinite;
        }

        .legend-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.8rem;
            background: #0b1120cc;
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 0.7rem 1.8rem;
            border: 1px solid #25345c;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
        }
        .badge-lvl {
            background: #0f172f;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.7rem;
        }

        @media (max-width: 780px) {
            .level-btn { padding: 0.4rem 1rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

            <path d="M360,610 L520,390" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrAI)" fill="none" stroke-dasharray="7 3"/>

    }

    function buildLevel4() {
        // MAX Level: Recursive Evolution, Autonomous Settlement without external APIs, full native mapping
        return `<svg viewBox="0 0 1550 900" xmlns="http://www.w3.org/2000/svg">
            <rect width="1550" height="900" fill="#020617" rx="30" stroke="#a855f7" stroke-width="2"/>
            <text x="775" y="55" text-anchor="middle" fill="#e9d5ff" font-size="20" font-weight="bold">🚀 LEVEL 4 – AUTONOMOUS EVOLUTION (Recursive Shadow + Self-Healing Economy)</text>
            <defs><marker id="arrL4" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,6 L12,3 z" fill="#f472b6"/></marker></defs>
            
            <g transform="translate(100, 180)">
                <rect width="280" height="100" rx="24" fill="#4c1d95" stroke="#e879f9" stroke-width="2.5"/>
                <text x="140" y="32" text-anchor="middle" fill="white" font-weight="bold">🌀 Recursive Shadow Pipeline</text>
                <text x="140" y="55" text-anchor="middle" fill="#f5d0fe">Nightly LoRA training on new Gold Logs</text>
                <text x="140" y="78" text-anchor="middle" fill="#f0abfc">Continuous model distillation</text>
            </g>
            <g transform="translate(550, 160)">
                <rect width="320" height="110" rx="28" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
                <text x="160" y="35" text-anchor="middle" fill="white" font-weight="bold" font-size="16">🌍 Native TechGeoAI Core</text>
                <text x="160" y="58" text-anchor="middle" fill="#a7f3d0">No external APIs (Maps/ChatGPT free)</text>
                <text x="160" y="78" text-anchor="middle" fill="#6ee7b7">Autonomous Two-Point mapping</text>
                <text x="160" y="98" text-anchor="middle" fill="#34d399">Self-settle + Biometric orchestration</text>
            </g>
            <g transform="translate(1050, 200)">
                <rect width="280" height="90" rx="24" fill="#0f172a" stroke="#facc15"/>
                <text x="140" y="32" text-anchor="middle" fill="white">📈 Zero Trust Settlement</text>
                <text x="140" y="54" text-anchor="middle" fill="#fef08a">Fully internal ledger, no oracle needed</text>
                <text x="140" y="74" text-anchor="middle" fill="#fde047">Global scalability</text>
            </g>
            <!-- multi-step autonomous -->
            <path d="M380,230 L540,215" stroke="#f472b6" stroke-width="3" marker-end="url(#arrL4)" fill="none" class="animated-flow"/>
            <text x="450" y="205" fill="#f9a8d4" font-size="12">Model update push</text>
            <path d="M870,215 L1040,245" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrL4)" fill="none"/>
            <text x="940" y="230" fill="#facc15" font-size="12">Autonomous settlement flow</text>
            <g transform="translate(300, 500)">
                <rect width="360" height="100" rx="28" fill="#2d1b4e" stroke="#a855f7" stroke-width="2"/>
                <text x="180" y="35" text-anchor="middle" fill="white" font-weight="bold">⚡ Full Recursive Evolution Cycle</text>
                <text x="180" y="58" text-anchor="middle" fill="#ddd6fe">Data → Gold Logs → Shadow Training → Native AI</text>

                <rect width="280" height="80" rx="20" fill="#1e1b2f" stroke="#60a5fa"/>

                <text x="140" y="55" text-anchor="middle" fill="#93c5fd">Continuous background evolution</text>

    }

    // current active level
    let currentLevel = 'L0';
    const svgContainer = document.getElementById('svgRoot');
    const btnMap = {
        'L0': buildLevel0, 'L1': buildLevel1, 'L2': buildLevel2, 'L3': buildLevel3, 'L4': buildLevel4
    };
    function renderLevel(level) {
        const builder = btnMap[level];
        if(builder) {
            svgContainer.innerHTML = builder();
            // add animation class to any .animated-flow elements after injection
            const animatedPaths = svgContainer.querySelectorAll('.animated-flow');
            animatedPaths.forEach(p => {
                p.style.animation = 'flowData 0.45s linear infinite';
            });
        }
    }
    // event listeners
    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const lvl = btn.getAttribute('data-level');
            if(!lvl) return;
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLevel = lvl;
            renderLevel(currentLevel);
        });
    });
    // initial render L0
    renderLevel('L0');
    // periodic pulse for dynamic feel
    setInterval(() => {
        const animated = document.querySelectorAll('.animated-flow');
        animated.forEach(p => {
            p.style.animation = 'none';
            setTimeout(() => { if(p) p.style.animation = 'flowData 0.45s linear infinite'; }, 10);
        });
    }, 2800);
</script>
</body>
