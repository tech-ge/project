<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Linux Multi-Alarm System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 500px; margin-bottom: 20px; }
        input, select, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #333; background: #2d2d2d; color: white; }
        button { cursor: pointer; background: #3498db; border: none; font-weight: bold; }
        button:hover { background: #2980b9; }
        .alarm-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .alarm-item.inactive { opacity: 0.5; }
        .delete-btn { background: #e74c3c; padding: 5px 10px; }
        .days-row { font-size: 12px; color: #aaa; }
        #current-time { font-size: 32px; font-weight: bold; color: #3498db; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="current-time">00:00:00</div>

    <div class="card">
        <h3>Add New Alarm</h3>
        <input type="time" id="new-time" value="05:20">
        <select id="new-freq">
            <option value="once">Once</option>
            <option value="daily">Daily</option>
            <option value="weekdays">Mon-Fri</option>
        </select>
        <input type="text" id="sound-url" placeholder="Sound URL (Optional)" value="alarm.mp3">
        <button onclick="addAlarm()">Add Alarm</button>
    </div>

    <div class="card" id="alarm-list">
        <h3>Active Alarms</h3>
        </div>

    <audio id="master-audio" loop></audio>
    <button id="stop-btn" style="display:none; background:red; width:200px; font-size:20px;" onclick="stopAlarm()">STOP ALARM</button>

    <script>
        let alarms = JSON.parse(localStorage.getItem('linux_alarms')) || [];
        const audio = document.getElementById('master-audio');

        function addAlarm() {
            const time = document.getElementById('new-time').value;
            const freq = document.getElementById('new-freq').value;
            const sound = document.getElementById('sound-url').value;
            
            if(!time) return;

            alarms.push({
                id: Date.now(),
                time: time,
                freq: freq,
                sound: sound,
                active: true,
                lastTriggered: null
            });
            
            saveAndRender();
        }

        function toggleAlarm(id) {
            alarms = alarms.map(a => a.id === id ? {...a, active: !a.active} : a);
            saveAndRender();
        }

        function deleteAlarm(id) {
            alarms = alarms.filter(a => a.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('linux_alarms', JSON.stringify(alarms));
            const list = document.getElementById('alarm-list');
            list.innerHTML = '<h3>Active Alarms</h3>';
            
            alarms.forEach(alarm => {
                const div = document.createElement('div');
                div.className = `alarm-item ${!alarm.active ? 'inactive' : ''}`;
                div.innerHTML = `
                    <div>
                        <strong>${alarm.time}</strong> (${alarm.freq})
                        <div class="days-row">${alarm.sound.substring(0,30)}...</div>
                    </div>
                    <div>
                        <button onclick="toggleAlarm(${alarm.id})">${alarm.active ? 'Disable' : 'Enable'}</button>
                        <button class="delete-btn" onclick="deleteAlarm(${alarm.id})">X</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function checkAlarms() {
            const now = new Date();
            const currentTime = now.toTimeString().substring(0, 5); // HH:MM
            const day = now.getDay(); // 0=Sun, 1=Mon...
            const todayStr = now.toDateString();

            document.getElementById('current-time').innerText = now.toLocaleTimeString();

            alarms.forEach(alarm => {
                if (!alarm.active || alarm.lastTriggered === todayStr) return;

                if (alarm.time === currentTime) {
                    let shouldTrigger = false;
                    
                    if (alarm.freq === 'once') {
                        shouldTrigger = true;
                        alarm.active = false; // Disable after one use
                    } else if (alarm.freq === 'daily') {
                        shouldTrigger = true;
                    } else if (alarm.freq === 'weekdays' && day >= 1 && day <= 5) {
                        shouldTrigger = true;
                    }

                    if (shouldTrigger) {
                        triggerAlarm(alarm);
                        alarm.lastTriggered = todayStr;
                    }
                }
            });
        }

        function triggerAlarm(alarm) {
            audio.src = alarm.sound;
            audio.play();
            document.getElementById('stop-btn').style.display = 'block';
            document.body.style.background = '#b33939';
        }

        function stopAlarm() {
            audio.pause();
            audio.currentTime = 0;
            document.getElementById('stop-btn').style.display = 'none';
            document.body.style.background = '#121212';
            saveAndRender();
        }

        setInterval(checkAlarms, 1000);
        saveAndRender();
    </script>
</body>
</html>
